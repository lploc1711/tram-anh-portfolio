<section id="awards" class="awards-container">
  <header class="section-header">
    <h1>🏅 Awards & Scholarships</h1>
    <p class="section-description">Recognition for excellence in research and academic achievements</p>
  </header>

  <div class="awards-timeline">
    <article *ngFor="let award of awards; trackBy: trackByFn" class="award-item">
      <!-- Desktop Year (hidden on mobile/tablet) -->
      <div class="desktop-year">
        <span class="award-year">{{ award.year }}</span>
      </div>

      <div class="award-card">
        <div class="award-header">
          <div class="award-icon-year">
            <span class="award-icon" [attr.aria-label]="award.type + ' icon'">{{ getIconForType(award.type) }}</span>
            <!-- Mobile/Tablet Year (hidden on desktop) -->
            <span class="award-year">{{ award.year }}</span>
          </div>
          <div class="award-type-badge" [class]="award.type">
            {{ award.type | titlecase }}
          </div>
        </div>

        <div class="award-content">
          <h3 class="award-title">{{ award.title }}</h3>
          <p class="award-organization">{{ award.organization }}</p>
          <p class="award-description">{{ award.description }}</p>
        </div>
      </div>
    </article>
  </div>
</section>
