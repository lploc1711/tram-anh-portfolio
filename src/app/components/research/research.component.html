<section id="research" class="section-wrapper">
  <div class="section-header">
    <h2>Research & Experience</h2>
    <div class="header-decoration"></div>
    <p class="section-subtitle">Advancing Food Science Through Innovation</p>
  </div>

  <!-- Research Statistics -->
  <div class="research-stats">
    <div class="stat-card">
      <div class="stat-number">5+</div>
      <div class="stat-label">Years Research</div>
    </div>
    <div class="stat-card">
      <div class="stat-number">3</div>
      <div class="stat-label">Institutions</div>
    </div>
    <div class="stat-card">
      <div class="stat-number">6</div>
      <div class="stat-label">Research Areas</div>
    </div>
    <div class="stat-card">
      <div class="stat-number">8+</div>
      <div class="stat-label">Techniques</div>
    </div>
  </div>

  <div class="section-content">
    <div class="experience-section">
      <h3><span class="section-icon">💼</span> Professional Experience</h3>
      <div class="experience-timeline">
        <div class="experience-item" *ngFor="let exp of researchExperiences; let i = index" [attr.data-index]="i">
          <div class="timeline-marker">
            <div class="timeline-dot">
              <span class="experience-number">{{ i + 1 }}</span>
            </div>
            <div class="timeline-line" *ngIf="i < researchExperiences.length - 1"></div>
          </div>
          <div class="experience-content">
            <div class="experience-card">
              <div class="experience-header">
                <div class="title-section">
                  <span class="position-icon">🎯</span>
                  <h4>{{ exp.title }}</h4>
                </div>
                <span class="period">{{ exp.period }}</span>
              </div>
              <p class="location">
                <span class="location-icon">📍</span>
                {{ exp.location }}
              </p>

              <div class="highlights" *ngIf="exp.highlights">
                <h5><span class="achievements-icon">✨</span> Key Achievements:</h5>
                <ul>
                  <li *ngFor="let highlight of exp.highlights">
                    <span class="bullet-icon">🔸</span>
                    {{ highlight }}
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
